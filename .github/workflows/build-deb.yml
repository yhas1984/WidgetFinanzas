name: Build and release Debian package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without v prefix)
        required: true
        default: '5.0.3'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libegl1 libgl1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile crypto_widget.py crypto_widgetV5.py
          python -m pytest -q
          ruff check crypto_widget.py crypto_widgetV5.py tests
      - name: Build package
        run: bash packaging/build-deb.sh "${RELEASE_TAG#v}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --generate-notes
          else
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "${RELEASE_TAG}" --generate-notes
          fi
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" widget-finanzas_*_amd64.deb --clobber
      - name: Upload workflow artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-finanzas-${{ github.ref_name }}
          path: widget-finanzas_*_amd64.deb
          if-no-files-found: error
